<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume Submission</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #4f46e5, #06b6d4);
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            width: 400px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        h2 {
            margin-top: 0;
            text-align: center;
            color: #111827;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 8px;
            border: 1px solid #d1d5db;
            font-size: 14px;
        }

        .file-box {
            border: 2px dashed #6366f1;
            padding: 20px;
            text-align: center;
            border-radius: 10px;
            margin-bottom: 15px;
            background: #f8fafc;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #4f46e5;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background: #4338ca;
        }

        button:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }

        .success {
            margin-top: 10px;
            color: green;
            text-align: center;
            display: none;
        }

        .loading {
            text-align: center;
            display: none;
            margin-top: 10px;
        }
    </style>

</head>

<body>

    <div class="container">
        <h2>Resume Submission</h2>

        <input type="text" id="name" placeholder="Full Name" required>
        <input type="email" id="email" placeholder="Email Address" required>

        <div class="file-box">
            <input type="file" id="file" />
        </div>

        <button id="submitBtn" onclick="upload()">Submit Resume</button>

        <div class="loading" id="loading">Uploading...</div>
        <div class="success" id="success">Resume submitted successfully 🎉</div>

    </div>

    <script>
        async function upload() {

            const name = document.getElementById("name").value;
            const email = document.getElementById("email").value;
            const file = document.getElementById("file").files[0];

            if (!name || !email || !file) {
                alert("Please fill all fields");
                return;
            }

            document.getElementById("submitBtn").disabled = true;
            document.getElementById("loading").style.display = "block";

            const reader = new FileReader();

            reader.onload = async function () {

                const base64 = reader.result.split(",")[1];

                await fetch("https://y3ama38a50.execute-api.ap-south-1.amazonaws.com/submit", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        name: name,
                        email: email,
                        filename: file.name,
                        file: base64
                    })
                });

                document.getElementById("loading").style.display = "none";
                document.getElementById("success").style.display = "block";
                document.getElementById("submitBtn").disabled = false;

            };

            reader.readAsDataURL(file);
        }
    </script>

</body>

</html>
